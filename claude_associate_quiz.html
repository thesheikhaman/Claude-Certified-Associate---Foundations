<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude Associate Foundations Practice Quiz</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1f2937;--muted:#6b7280;--primary:#6d28d9;--primary2:#a855f7;--ok:#15803d;--bad:#b91c1c;--line:#e5e7eb}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,#ede9fe 0,#f8fafc 42%,#eef2ff 100%);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 8px 25px rgba(31,41,55,.08)}
.top{max-width:1100px;margin:auto;padding:14px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.title{font-size:clamp(18px,3vw,28px);font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.timer{min-width:150px;text-align:center;padding:10px 14px;border-radius:16px;background:#111827;color:#fff;font-size:22px;font-weight:800;letter-spacing:1px}.timer.warn{background:#b45309}.timer.danger{background:#b91c1c;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.03)}}
.progress-wrap{grid-column:1/-1}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.25s}.stats{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
main{max-width:900px;margin:28px auto 100px;padding:0 16px}.hero{background:linear-gradient(135deg,#4c1d95,#7c3aed 55%,#c026d3);color:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 45px rgba(109,40,217,.25);margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}.hero p{margin:6px 0;opacity:.92}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:13px}
.section-title{margin:28px 0 12px;font-size:22px}.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 8px 24px rgba(31,41,55,.06)}.qhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}.num{background:#ede9fe;color:var(--primary);font-weight:800;border-radius:10px;padding:6px 9px}.domain{font-size:12px;color:#6d28d9;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.question{font-weight:700;line-height:1.45;margin:10px 0 14px}.option{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;transition:.15s}.option:hover{border-color:#a78bfa;background:#faf5ff}.option input{margin-top:3px;accent-color:var(--primary)}
.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:12px;display:flex;justify-content:center;gap:10px;z-index:9}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff}.secondary{background:#eef2ff;color:#4338ca}
#result{display:none;border-radius:22px;padding:26px;margin:24px 0;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.08)}#result.pass{display:block;background:#ecfdf5;border:2px solid #86efac;color:#14532d}#result.fail{display:block;background:#fef2f2;border:2px solid #fca5a5;color:#7f1d1d}.score{font-size:48px;font-weight:900}.review{margin-top:12px;font-weight:700}.correct{border-color:#86efac;background:#f0fdf4}.wrong{border-color:#fca5a5;background:#fef2f2}.answer-note{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;font-size:13px;color:#475569}
@media(max-width:600px){.top{grid-template-columns:1fr}.timer{justify-self:start}.hero{padding:22px}.actions{justify-content:stretch}.actions .btn{flex:1}}
</style>
</head>
<body>
<header><div class="top"><div><div class="title">Claude Associate Foundations Quiz</div><div class="sub">40 original practice questions • 120 minutes • Pass mark: 72%</div></div><div id="timer" class="timer">02:00:00</div><div class="progress-wrap"><div class="progress"><div id="bar" class="bar"></div></div><div class="stats"><span id="answered">0 of 40 answered</span><span id="pct">0%</span></div></div></div></header>
<main><section class="hero"><h1>Test your knowledge</h1><p>Complete all four practice sets before time expires. Some questions may have more than one correct answer.</p><span class="pill">You need at least 29 correct answers to pass</span></section><div id="result"></div><form id="quiz"></form></main>
<div class="actions"><button class="btn secondary" type="button" onclick="resetQuiz()">Reset quiz</button><button class="btn primary" type="button" onclick="submitQuiz(false)">Submit answers</button></div>
<script>
const questions = [
{set:1,d:'Output Evaluation',q:'A report includes a security certification that is not present in the supplied evidence. What should you do?',o:['Accept it because it sounds credible','Verify it using an authoritative source or remove it','Replace it with another certification','Only improve the formatting'],a:[1]},
{set:1,d:'Workflow Design',q:'Before introducing Claude into a repetitive weekly classification process, what should the team do first?',o:['Automate every step','Document inputs, decisions, exceptions, outputs, and review points','Select the most expensive model','Remove human review'],a:[1]},
{set:1,d:'Prompting',q:'Which prompt improvement is most likely to produce a useful launch announcement?',o:['Use capital letters','Request unrestricted creativity','Define audience, purpose, facts, tone, length, and format','Ask for many versions without a goal'],a:[2]},
{set:1,d:'Responsible Use',q:'Which safeguards matter most when AI supports applicant screening? Select two.',o:['Assess criteria and outcomes for unfairness','Keep AI use secret','Treat confidence as objectivity','Require qualified human review before decisions'],a:[0,3]},
{set:1,d:'Product Selection',q:'A colleague needs an interactive calculator that can be adjusted while chatting. What is the best fit?',o:['An interactive artifact','An empty project','Research mode for every calculation','A memory entry with one fixed result'],a:[0]},
{set:1,d:'Troubleshooting',q:'A required risk is often missed when it appears late in a long source. Which test best isolates the cause?',o:['Change model, source, and prompt together','Move equivalent evidence to different positions while holding other variables constant','Add unrelated examples','Test only easy documents'],a:[1]},
{set:1,d:'Knowledge Management',q:'A project knowledge base contains a policy that has been replaced. What should the owner do?',o:['Keep both versions unlabeled','Instruct Claude to ignore dates','Update the source and dependent instructions','Start a new chat but retain stale knowledge'],a:[2]},
{set:1,d:'Output Evaluation',q:'Two drafts are accurate, but one is tailored to executives and the other to engineers. How should you choose?',o:['Select the longer one','Select the first one','Merge every sentence','Choose based on intended audience and decision need'],a:[3]},
{set:1,d:'Task Decomposition',q:'A request combines research, pricing, planning, and an executive memo. Which actions help? Select two.',o:['Define a deliverable and success criterion for each stage','Request one undifferentiated paragraph','Write conclusions before research','Sequence stages so validated evidence informs later work'],a:[0,3]},
{set:1,d:'Value Communication',q:'How should you describe Claude\'s value to a team worried about role replacement?',o:['Promise role elimination','Explain augmented tasks, benefits, limits, and human-owned decisions','Discuss only model capabilities','Avoid uncertainty'],a:[1]},
{set:2,d:'Model Selection',q:'For a complex strategic trade-off where quality matters more than speed or cost, which starting point is most suitable?',o:['A speed-first small model without testing','A quality-oriented model evaluated against requirements','Any model without evaluation','A connector instead of a model'],a:[1]},
{set:2,d:'Data Governance',q:'An employee puts confidential quarterly results into an unapproved personal AI account. What is the primary concern?',o:['The prompt is short','No artifact was requested','Sensitive data is outside approved organizational controls','Financial data can never be analyzed by AI'],a:[2]},
{set:2,d:'Source Validation',q:'A research note includes several links. How should its key conclusion be validated?',o:['Count the links','Assume links prove the claim','Ask the model if it invented anything','Open the sources and confirm they directly support the claim in context'],a:[3]},
{set:2,d:'Workflow Integration',q:'Which choices support responsible AI-assisted claims summaries? Select two.',o:['Place the draft before the existing adjuster approval','Allow drafts to trigger payments automatically','Capture reviewer corrections for evaluation','Measure success only by output volume'],a:[0,2]},
{set:2,d:'Optimization',q:'Accuracy improves after a prompt change, but processing time doubles. What next?',o:['Keep it because accuracy improved','Compare both results with defined quality and efficiency targets','Reject any latency increase','Change multiple variables without recording them'],a:[1]},
{set:2,d:'Prompting',q:'What should be added when Claude is asked to evaluate a proposal without evaluation criteria?',o:['A request to be smarter','Decorative adjectives','A rubric with dimensions, evidence standards, and recommendation format','A ban on uncertainty'],a:[2]},
{set:2,d:'Project Configuration',q:'A team uses a shared project but gives inconsistent recurring instructions. What would improve consistency?',o:['Store instructions in one person\'s memory','Let every user improvise','Upload files without defining the task','Add shared project instructions covering role, process, limits, and output'],a:[3]},
{set:2,d:'Quality Review',q:'A brief includes all headings but gives two different launch dates. Which quality dimension failed?',o:['Internal consistency','Visual polish','Audience selection','File naming'],a:[0]},
{set:2,d:'Governance',q:'Before using AI in public-benefit eligibility decisions, which questions are essential? Select two.',o:['Can the interface match brand colors?','What legal, policy, and appeal rules apply?','Can it always sound confident?','Which decisions require accountable human judgment?'],a:[1,3]},
{set:2,d:'Solution Design',q:'Users lose version history while copying information among several tools. What should be addressed?',o:['Interface color','Prompt adjectives','Handoffs, integration, and records of work','Model name only'],a:[2]},
{set:3,d:'Requirements Analysis',q:'What evidence should be gathered first when defining an AI-assisted onboarding use case?',o:['A commitment to reduce staffing','A general feature list','Current tasks, pain points, sources, exceptions, and measurable outcomes','Only a preferred model name'],a:[2]},
{set:3,d:'Task Structure',q:'For a report based on five documents, which approach best reduces missed requirements?',o:['One broad sentence','Conclude before reading','Use every possible format','Separate extraction, comparison, gap analysis, and synthesis with criteria'],a:[3]},
{set:3,d:'Responsible Use',q:'Why is sending model-written medical recommendations without clinical review inappropriate?',o:['It delegates a consequential health decision without qualified oversight','Medical prompts must be long','AI cannot assist with health education','The output is not an artifact'],a:[0]},
{set:3,d:'Data Validation',q:'A market estimate mixes figures from different years. Which checks are needed? Select two.',o:['Average all figures regardless of scope','Verify figures, dates, and source context','Remove publication dates','Confirm compatible definitions, units, and reporting periods'],a:[1,3]},
{set:3,d:'Knowledge Management',q:'A team repeatedly uses the same product and competitor material. How should it centralize that context?',o:['Open a temporary chat each time','Save only the latest answer','Maintain a shared project with knowledge and recurring instructions','Use research without internal sources'],a:[2]},
{set:3,d:'Content Curation',q:'A connected folder contains approved policies and similar-looking drafts. What should the owner do?',o:['Let the model infer authority','Give every file the same name','Prefer newer writing style','Clearly identify authoritative files and label or remove obsolete drafts'],a:[3]},
{set:3,d:'Troubleshooting',q:'A classification prompt fails after the input form changes. What should be checked first?',o:['Whether the new structure still matches prompt assumptions and examples','Whether the interface logo changed','Whether old outputs can be deleted','Whether a longer response hides errors'],a:[0]},
{set:3,d:'Completeness',q:'A summary accurately covers nine of ten required clauses. How should it be assessed?',o:['Fully acceptable','Accurate but incomplete, with the missing clause identified','Hallucinated','Biased because it is short'],a:[1]},
{set:3,d:'Brainstorming',q:'A prompt produces minor variations of one idea. Which revisions help? Select two.',o:['Prohibit reuse of the same underlying mechanism','Ask for one longer version','Request ideas from different perspectives or constraints','Remove the business objective'],a:[0,2]},
{set:3,d:'Fairness',q:'A performance-review draft applies different standards to similar employees. What is the appropriate response?',o:['Send it because the wording is professional','Remove names and keep ratings','Increase confidence','Pause use, examine criteria for bias, and obtain qualified human review'],a:[3]},
{set:4,d:'Configuration',q:'Project instructions reference an older policy year, but only the current policy is available. What should be done?',o:['Restore the obsolete policy','Keep the mismatch','Remove all policies','Update instructions to the current policy and recheck examples'],a:[3]},
{set:4,d:'Audience Fit',q:'An accurate customer email uses unexplained technical acronyms. What is the best refinement?',o:['Rewrite in customer-friendly language while preserving verified meaning','Add more acronyms','Remove supporting facts','Change the audience to engineers'],a:[0]},
{set:4,d:'Professional Oversight',q:'Which design best supports legal research while retaining accountability?',o:['Autonomous final legal advice','AI-assisted research and drafting followed by lawyer verification and approval','Remove citations','Use AI only after advice is sent'],a:[1]},
{set:4,d:'Examples in Prompts',q:'A prompt includes strong and weak incident-summary examples. What additions make them useful? Select two.',o:['State the criteria to transfer to new cases','Leave examples unlabeled','Explain why each example succeeds or fails','Require exact copying'],a:[0,2]},
{set:4,d:'Responsible Marketing',q:'What is the main concern with presenting invented customer quotations as real testimonials?',o:['Testimonials must be long','AI cannot assist marketing','Research mode was not used','It deceptively attributes fabricated statements to customers'],a:[3]},
{set:4,d:'Model Selection',q:'A high-volume routine tagging task has strict cost and latency limits. What is a sensible first approach?',o:['Start with a fast lower-cost model, then validate on representative samples','Use the biggest model without comparison','Avoid automation','Use an output feature instead of choosing a model'],a:[0]},
{set:4,d:'Controlled Testing',q:'Five prompt instructions changed together, so the team cannot identify which caused improvement. What practice should it adopt?',o:['Continue untracked changes','Change one variable at a time and record results against a test set','Use one favorable example','Discard the baseline'],a:[1]},
{set:4,d:'Balanced Analysis',q:'A recommendation uses correct facts but omits a major drawback in the source. What should be flagged?',o:['A spelling issue','A proven context-window issue without investigation','A materially incomplete and potentially one-sided analysis','Model choice alone'],a:[2]},
{set:4,d:'Project Maintenance',q:'Which practices help a shared project stay reliable? Select two.',o:['Keep obsolete sources indefinitely','Record material instruction changes','Allow unreviewed edits by anyone','Assign an owner and review sources on a defined cadence'],a:[1,3]},
{set:4,d:'Process Optimization',q:'An accurate pilot is slower because staff repeatedly re-enter the same data. What should be redesigned?',o:['Integration and handoffs so validated data flows forward','Only the response tone','Vacation policy','Only brainstorming prompts'],a:[0]}
];
const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';for(let set=1;set<=4;set++){const h=document.createElement('h2');h.className='section-title';h.textContent=`Set ${set}`;quiz.appendChild(h);questions.forEach((x,i)=>{if(x.set!==set)return;const multi=x.a.length>1;const div=document.createElement('section');div.className='q';div.id='q'+i;div.innerHTML=`<div class="qhead"><span class="num">${i+1}</span><span class="domain">${x.d}</span></div><div class="question">${x.q}${multi?' <small>(Select all that apply)</small>':''}</div>`+x.o.map((t,j)=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="q${i}" value="${j}"><span><b>${String.fromCharCode(65+j)}.</b> ${t}</span></label>`).join('');quiz.appendChild(div)})}wire();updateProgress()}
function wire(){document.querySelectorAll('input').forEach(el=>el.addEventListener('change',updateProgress))}
function updateProgress(){let n=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});document.getElementById('answered').textContent=`${n} of ${questions.length} answered`;const p=Math.round(n/questions.length*100);document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%'}
let seconds=120*60, clock;
function startTimer(){clearInterval(clock);clock=setInterval(()=>{seconds--;showTime();if(seconds<=0){clearInterval(clock);submitQuiz(true)}},1000)}
function showTime(){const h=String(Math.floor(seconds/3600)).padStart(2,'0'),m=String(Math.floor(seconds%3600/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');const el=document.getElementById('timer');el.textContent=`${h}:${m}:${s}`;el.className='timer'+(seconds<=300?' danger':seconds<=900?' warn':'')}
function submitQuiz(auto){clearInterval(clock);let score=0,unanswered=0;questions.forEach((x,i)=>{const chosen=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>+e.value).sort();const ans=[...x.a].sort();const ok=chosen.length===ans.length&&chosen.every((v,k)=>v===ans[k]);if(ok)score++;if(!chosen.length)unanswered++;const box=document.getElementById('q'+i);box.classList.remove('correct','wrong');box.classList.add(ok?'correct':'wrong');let note=box.querySelector('.answer-note');if(note)note.remove();note=document.createElement('div');note.className='answer-note';note.textContent=`Correct answer: ${ans.map(v=>String.fromCharCode(65+v)).join(', ')}`;box.appendChild(note)});const pct=score/questions.length*100,pass=pct>=72;const r=document.getElementById('result');r.className=pass?'pass':'fail';r.innerHTML=`<div class="score">${pct.toFixed(1)}%</div><h2>${pass?'Passed 🎉':'Not passed yet'}</h2><p>${score} correct out of ${questions.length}. Pass mark is 72% (${Math.ceil(questions.length*.72)} correct).</p>${unanswered?`<p>${unanswered} question(s) were unanswered${auto?' when time expired':''}.</p>`:''}<div class="review">Review the highlighted answers below.</div>`;r.scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('input').forEach(e=>e.disabled=true)}
function resetQuiz(){seconds=120*60;document.getElementById('result').className='';document.getElementById('result').innerHTML='';render();showTime();startTimer();window.scrollTo({top:0,behavior:'smooth'})}
render();showTime();startTimer();
</script>
</body></html>
