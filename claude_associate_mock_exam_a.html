<script>const DATA=[{"domain": "Prompting and Task Execution", "q": "A manager asks for a board update but gives no audience, length, or decision context.", "options": ["Define the audience, purpose, required evidence, length, tone, and format.", "Ask only for a more professional response.", "Increase creativity and remove constraints.", "Generate ten drafts before identifying the goal."], "answer": [0], "explanation": "Observable requirements make the output easier to evaluate.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "A policy comparison requires extracting facts from six documents before recommending a change.", "options": ["Ask for the final recommendation in one sentence.", "Request a conclusion before reviewing the documents.", "Mix extraction and brainstorming without checkpoints.", "Split the work into extraction, comparison, gap analysis, and recommendation stages."], "answer": [3], "explanation": "Decomposition makes evidence handling and conclusions separately reviewable.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "A classification prompt works inconsistently because category boundaries overlap.", "options": ["Add more categories without definitions.", "Remove examples to make the prompt shorter.", "Define each category, add decision rules, and include labeled edge cases.", "Ask the model to be certain."], "answer": [2], "explanation": "Explicit boundaries and edge cases reduce ambiguity.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "A brainstorming session keeps returning variations of the same campaign idea.", "options": ["Request fewer ideas with no diversity criteria.", "Request ideas from distinct perspectives and prohibit reuse of the same mechanism.", "Ask for a longer version of the first idea.", "Remove the campaign objective."], "answer": [1], "explanation": "Perspective and non-repetition constraints widen the solution space.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "A summary must never omit risks, decisions, owners, or dates.", "options": ["Specify a required output schema and a completeness checklist.", "Ask for a useful summary.", "Use a friendlier tone only.", "Let the model choose which fields matter."], "answer": [0], "explanation": "A schema turns required elements into testable constraints.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "The user wants a concise answer but receives long essays.", "options": ["Write the request in capital letters.", "Add unrelated background.", "Ask for complete detail without limits.", "Set a word limit and specify the desired structure."], "answer": [3], "explanation": "Length and format constraints directly address verbosity.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "A prompt contains a good example, but the model copies its topic rather than its structure.", "options": ["Tell the model to copy exactly.", "Remove the actual task description.", "Explain which features of the example should transfer and which content should not.", "Add three unlabeled examples."], "answer": [2], "explanation": "Transfer criteria help the model generalize the intended pattern.", "multi": false}, {"domain": "Prompting and Task Execution", "q": "A research task needs claims separated from assumptions.", "options": ["Request only a conclusion.", "Require source-backed facts and clearly labeled assumptions in separate sections.", "Ask for a confident answer.", "Ban uncertainty language."], "answer": [1], "explanation": "Explicit evidence labels make grounding visible.", "multi": false}, {"domain": "Output Evaluation and Validation", "q": "A supplier comparison claims a certification that is absent from the provided proposals.", "options": ["Mark the claim unverified and check an authoritative source before use.", "Keep it because it is plausible.", "Replace it with a different certification.", "Polish the table and ignore the claim."], "answer ate drafts target different audiences.", "options": ["Choose the longest draft.", "Choose the first generated draft.", "Merge every sentence.", "Select the draft that matches the intended audience and decision need."], "answer": [3], "explanation": "Fitness for purpose is part of quality.", "multi": false}, {"domain": "Output Evaluation and Validation", "q": "A market estimate combines figures using different definitions and currencies.", "options": ["Remove units from the report.", "Use the newest figure only without checking scope.", "Normalize definitions, units, periods, and currencies before combining values.", "Average every number."], "answer": [2], "explanation": "Comparable measurements are required for a valid synthesis.", "multi": false}, {"domain": "Output Evaluation and Validation", "q": "A generated procedure looks complete but has not been tested.", "options": ["Add more headings.", "Validate critical steps with a subject-matter expert or controlled test.", "Publish it because it is well structured.", "Assume completeness proves correctness."], "answer": [1], "explanation": "High-impact procedural claims need independent verification.", "multi": false}, {"domain": "Output Evaluation and Validation", "q": "A summary accurately describes the source but uses technical language for customers.", "options": ["Adapt it to customer-friendly language while preserving verified meaning.", "Change the audience to engineers.", "Remove the supporting facts.", "Add more acronyms."], "answer": [0], "explanation": "Audience adaptation should not sacrifice correctness.", "multi": false}, {"domain": "Output Evaluation and Validation", "q": "A response states a precise statistic with no cited evidence.", "options": ["Accept it because precision signals confidence.", "Round it and keep it.", "Add a chart without a source.", "Treat it as unsupported until verified or remove the precision."], "answer": [3], "explanation": "Specific numerical claims require evidence.", "mult e model."], "answer": [0], "explanation": "Straightforward high-volume work favors efficiency, subject to evaluation.", "multi": false}, {"domain": "Product and Model Selection", "q": "Colleagues need to interact with a calculator produced in a conversation.", "options": ["Store the final number in memory.", "Create an empty project.", "Use research mode for each arithmetic step.", "Use an artifact suitable for an interactive standalone output."], "answer": [3], "explanation": "An artifact fits an output that users need to interact with.", "multi": false}, {"domain": "Product and Model Selection", "q": "A team repeatedly analyzes the same maintained internal documents.", "options": ["Rely only on personal memory.", "Create a static image of the documents.", "Use a shared Project with curated knowledge and recurring instructions.", "Start an unrelated temporary chat each time."], "answer": [2], "explanation": "Projects centralize reusable context and instructions.", "multi": false}, {"domain": "Product and Model Selection", "q": "A question requires current external evidence beyond supplied files.", "options": ["Create a project with no sources.", "Use an appropriate research capability and verify the resulting sources.", "Rely on model memory alone.", "Use artifacts without research."], "answer": [1], "explanation": "Current claims require retrieval and source validation.", "multi": false}, {"domain": "Product and Model Selection", "q": "A long conversation has accumulated stale assumptions and conflicting directions.", "options": ["Summarize validated context and restart with clean, current instructions.", "Keep adding corrections indefinitely.", "Ignore contradictions.", "Store every message as permanent memory."], "answer": [0], "explanation": "A clean context can remove accumulated instruction conflict.", "multi": false}, {"domain": "Product and Model Selection", "q": "A one-off wording edit needs no persistent team context.", "options": ["Create a complex shared project automatically.", "Use the highest-cost model without testing.", "Build an integration first.", "Use a standard chat with clear instructions."], "answer": [3], "explanation": "Tooling should match the task’s persistence and complexity.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A team wants to automate a weekly review process immediately.", "options": ["Map inputs, decisions, exceptions, outputs, controls, and handoffs first.", "Remove all review steps.", "Select a model before defining the use case.", "Measure only output volume."], "answer": [0], "explanation": "Workflow analysis should precede automation.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "Claude drafts claim summaries in a regulated process.", "options": ["Let drafts trigger payments.", "Remove the approval record.", "Hide corrections from the team.", "Place drafts before the accountable reviewer and preserve approval authority."], "answer": [3], "explanation": "AI should augment rather than bypass accountable decisions.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A pilot creates good drafts but users re-enter data across three systems.", "options": ["Increase prompt length.", "Ignore version history.", "Redesign integrations and handoffs so validated data flows forward.", "Change only the writing tone."], "answer": [2], "explanation": "Operational value depends on the full process, not only text quality.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "Stakeholders ask whether AI will eliminate a professional role.", "options": ["Avoid mentioning uncertainty.", "Describe task-level augmentation, expected benefits, limits, and human ownership.", "Promise complete replacement.", "Discuss only model names."], "answer": [1], "explanation": "Responsible value communication is specific about tasks and accountability.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A process has rare exceptions with high financial impact.", "options": ["Route exceptions to qualified human review and monitor their outcomes.", "Automate exceptions first.", "Discard exception records.", "Treat every case identically."], "answer": [0], "explanation": "High-impact exceptions need explicit controls.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A support pilot is fast but users frequently correct product facts.", "options": ["Scale immediately based on speed.", "Stop recording corrections.", "Measure only response count.", "Capture corrections, measure error patterns, and improve the workflow before scaling."], "answer": [3], "explanation": "Correction data supports evaluation and iteration.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A workflow objective is described as “use AI more.”", "options": ["Maximize generated text.", "Remove existing metrics.", "Define the business problem, baseline, target outcome, and success measures.", "Choose tools based on popularity."], "answer": [2], "explanation": "A use case needs an observable problem and measurable outcome.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A handoff loses the source evidence used for a recommendation.", "options": ["Rely on the recipient to recreate sources.", "Preserve source references and decision records through the handoff.", "Send only the conclusion.", "Delete intermediate evidence."], "answer": [1], "explanation": "Traceability supports review and accountability.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A team wants full automation, but policy requires approval for final decisions.", "options": ["Automate preparation while retaining the required approval checkpoint.", "Ignore the policy during the pilot.", "Simulate approval silently.", "Remove audit logs."], "answer": [0], "explanation": "Solution design must respect required controls.", "multi": false}, {"domain": "Workflow Integration and Solution Design", "q": "A successful prototype depends on one employee manually fixing every output.", "options": ["Ignore the rework because outputs look good.", "Scale the same process.", "Measure only final accuracy.", "Treat the hidden rework as workflow cost and redesign or narrow the use case."], "answer": [3], "explanation": "End-to-end effort matters when judging viability.", "multi": false}, {"domain": "Configuration and Knowledge Management", "q": "A Project contains an obsolete policy and a current policy with similar names.", "options": ["Tell users to ignore dates.", "Prefer whichever has better formatting.", "Remove or clearly label obsolete content and identify the authoritative source.", "Leave both unlabeled."], "answer": [2], "explanation": "Knowledge curation must make authority and currency clear.", "multi": false}, {"domain": "Configuration and Knowledge Management", "q": "Team members give different baseline instructions for the same recurring review.", "options": ["Upload more files without instructions.", "Create shared Project instructions for role, process, boundaries, and format.", "Keep instructions in one person’s private memory.", "Let everyone improvise."], "answer": [1], "explanation": "Shared instructions improve repeatability.", "multi": false}, {"domain": "Configuration and Knowledge Management", "q": "Knowledge changes frequently but no one owns updates.", "options": ["Assign an owner and a defined review cadence.", "Let sources age indefinitely.", "Allow silent edits by anyone.", "Depend on users to notice errors."], "answer": [0], "explanation": "Ownership and scheduled review reduce stale knowledge.", "multi": false}, {"domain": "Configuration and Knowledge Management", "q": "Project instructions refer to a policy version no longer in the knowledge base.", "options": ["Restore the old policy by default.", "Keep the mismatch.", "Remove est scores.", "options": ["Hide AI use.", "Optimize only for speed.", "Test for unfair effects and require qualified human review before decisions.", "Document the review outcome and retain an appropriate audit trail."], "answer": [2, 3], "explanation": "Consequential employment decisions require fairness controls and accountability. Documentation makes the decision traceable.", "multi": true}, {"domain": "Governance, Risk, and Responsible Use", "q": "A marketing team wants invented customer quotes presented as authentic testimonials.", "options": ["Increase realism.", "Reject the deceptive attribution and use clearly disclosed synthetic examples if appropriate.", "Publish them as genuine.", "Remove quotation marks only."], "answer": [1], "explanation": "Fabricated endorsements must not be misrepresented as real.", "multi": false}, {"domain": "Governance, Risk, and Responsible Use", "q": "A model-written medical recommendation would be sent without clinician review.", "options": ["Do not delegate the consequential recommendation without qualified clinical oversight.", "Send it if it sounds cautious.", "Use a longer prompt.", "Convert it to an artifact."], "answer": [0], "explanation": "High-impact health recommendations require qualified oversight.", "multi": false}, {"domain": "Governance, Risk, and Responsible Use", "q": "A public-benefit workflow uses AI to determine eligibility.", "options": ["Focus on interface colors.", "Assume confidence equals correctness.", "Document the review outcome and retain an appropriate audit trail.", "Identify legal, policy, appeal, and human-accountability requirements before deployment."], "answer": [2, 3], "explanation": "Consequential public decisions require governance and recourse. Documentation makes the decision traceable.", "multi": true}, {"domain": "Governance, Risk, and Responsible Use", "q": "A system collects more personal data than the task needs.", "options": ["Hide fields from the interface but retain them.", "Use es after a prompt update.", "options": ["Keep it because one metric improved.", "Reject any latency change.", "Change the model and prompt together.", "Compare the result against predefined quality, latency, and cost targets."], "answer": [3], "explanation": "Optimization requires explicit trade-off criteria.", "multi": false}, {"domain": "Troubleshooting and Optimization", "q": "Failures occur mainly when key evidence appears late in long inputs.", "options": ["Add unrelated examples.", "Test only evidence at the beginning.", "Test equivalent evidence at multiple positions while holding other factors constant.", "Shorten every output."], "answer": [2], "explanation": "A controlled position test isolates placement sensitivity.", "multi": false}, {"domain": "Troubleshooting and Optimization", "q": "A reliable classifier fails after the input form changes.", "options": ["Delete historical tests.", "Check whether the new structure still matches prompt assumptions and examples.", "Change the interface theme.", "Increase output length."], "answer": [1], "explanation": "The changed input format is the most direct candidate cause.", "multi": false}, {"domain": "Troubleshooting and Optimization", "q": "A prompt performs well on one hand-picked example.", "options": ["Evaluate it on a representative test set including edge cases.", "Deploy based on the single success.", "Remove difficult examples.", "Score only fluency."], "answer": [0], "explanation": "Representative testing reveals generalization and failure modes.", "multi": false}, {"domain": "Troubleshooting and Optimization", "q": "The team cannot reproduce an earlier good result.", "options": ["Rely on memory.", "Keep editing without versioning.", "Save only the final prose.", "Record prompt version, model choice, inputs, configuration, and evaluation outcome."], "answer": [3], "explanation": "Reproducibility depends on recorded conditions.", "multi": false}];let seconds=7200,clock,current='All';const quiz=document.ge function render(){quiz.innerHTML='';DATA.forEach((x,i)=>{const q=document.createElement('section');q.className='q';q.dataset.domain=x.domain;q.id='q'+i;const typ=x.answer.length>1?'checkbox':'radio';q.innerHTML=`<div class="qtop"><span class="num">Question ${i+1}</span><span class="domain">${x.domain}</span></div><div class="qt">${x.q} ${x.answer.length>1?'<small>(Select two)</small>':''}</div>`+x.options.map((o,j)=>`<label class="opt"><input type="${typ}" name="q${i}" value="${j}"><span><b>${String.fromCharCode(65+j)}.</b> ${o}</span></label>`).join('');quiz.appendChild(q)});document.querySelectorAll('input').forEach(e=>e.onchange=progress);applyFilter();progress()}
function filters(){const ds=['All',...new Set(DATA.map(x=>x.domain))];document.getElementById('filters').innerHTML=ds.map(d=>`<button type="button" class="filter ${d==='All'?'active':''}" onclick="setFilter(this,'${d.replace(/'/g,"\'")}')">${d}</button>`).join('')}
function setFilter(el,d){current=d;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');applyFilter()}function applyFilter(){document.querySelectorAll('.q').forEach(q=>q.style.display=current==='All'||q.dataset.domain===current?'block':'none')}
function progress(){let n=0;DATA.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});let p=Math.round(n/DATA.length*100);answered.textContent=`${n} of ${DATA.length} answered`;document.getElementById('progress').textContent=p+'%';fill.style.width=p+'%'}
function tick(){clearInterval(clock);clock=setInterval(()=>{seconds--;show();if(seconds<=0){clearInterval(clock);submitQuiz(true)}},1000)}function show(){let h=String(Math.floor(seconds/3600)).padStart(2,'0'),m=String(Math.floor(seconds%3600/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');timer.textContent=`${h}:${m}:${s}`;timer.className='timer'+(seconds<=300?' danger':seconds<=900?' warn':'')}
function submitQuiz(auto){clearInterval(clock);let score=0,domain={},un=0;DATA.forEach((x,i)=>{let ch=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>+e.value).sort(),ans=[...x.answer].sort(),ok=ch.length===ans.length&&ch.every((v,k)=>v===ans[k]);domain[x.domain]??=[0,0];domain[x.domain][1]++;if(ok){score++;domain[x.domain][0]++}if(!ch.length)un++;let box=document.getElementById('q'+i);box.classList.add(ok?'correct':'wrong');let n=document.createElement('div');n.className='note';n.innerHTML=`<b>Correct answer:</b> ${ans.map(v=>String.fromCharCode(65+v)).join(', ')}<br>${x.explanation}`;box.appendChild(n)});document.querySelectorAll('input').forEach(e=>e.disabled=true);current='All';applyFilter();let pct=score/DATA.length*100,pass=pct>=72,r=document.getElementById('result');r.className='result '+(pass?'pass':'fail');r.innerHTML=`<div class="score">${pct.toFixed(1)}%</div><h2>${pass?'Passed 🎉':'Not passed yet'}</h2><p>${score}/60 correct. ${un?un+' unanswered'+(auto?' when time expired.':'.'):''}</p><div class="breakdown">${Object.entries(domain).map(([d,v])=>`<div class="metric"><b>${d}</b><br>${v[0]}/${v[1]} (${Math.round(v[0]/v[1]*100)}%)</div>`).join('')}</div>`;r.scrollIntoView({behavior:'smooth'})}
function resetQuiz(){seconds=7200;document.getElementById('result').className='result';document.getElementById('result').innerHTML='';render();show();tick();scrollTo({top:0,behavior:'smooth'})}filters();render();show();tick();</script></body></html>
